<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Linktree sederhana - semua tautan penting saya dalam satu tempat." />
  <title>LinktreeKu</title>
  <style>
    :root {
      --bg-1: #0f0c29;
      --bg-2: #24243e;
      --bg-3: #302b63;
      --text: #f5f5f5;
      --muted: #b3b3cc;
      --accent: #7c5cff;
      --accent-2: #ff7eb3;
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    header.avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    header.avatar img {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 8px 30px rgba(124, 92, 255, 0.35);
    }

    header.avatar h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    header.avatar p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .socials a:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      box-shadow: 0 6px 20px rgba(124, 92, 255, 0.4);
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
    }

    .links a:focus-visible,
    .socials a:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 3px;
    }

    .links .badge {
      margin-left: auto;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      opacity: 0.9;
    }

    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header class="avatar">
      <img id="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=Nama%20Kamu" alt="Avatar" />
      <h1 id="name">Nama Kamu</h1>
      <p id="bio">Ini adalah bio singkat kamu.</p>
    </header>

    <nav class="socials" id="socials" aria-label="Media sosial"></nav>

    <nav class="links" id="links" aria-label="Tautan"></nav>

    <footer>
      &copy; <span id="year"></span> Nama Kamu &middot; dibuat dengan
      <a href="#" id="footerLink">LinktreeKu</a>
    </footer>
  </main>

  <script>
    // ============================================================
    // EDIT DATA DI BAWAH INI - ganti dengan profil kamu sendiri
    // ============================================================
    const PROFILE = {
      name: "Nama Kamu",
      bio: "Ini adalah bio singkat kamu.",
      avatar: "https://api.dicebear.com/9.x/initials/svg?seed=Nama%20Kamu",
      // Tautan / link button utama (urutan = urutan tampil)
      links: [
        { label: "Instagram",  url: "https://instagram.com/username", icon: "insta" },
        { label: "YouTube",    url: "https://youtube.com/@username", icon: "yt" },
        { label: "TikTok",     url: "https://tiktok.com/@username",  icon: "tt" },
        { label: "Website",    url: "https://example.com",          icon: "globe" },
        { label: "Kontak Saya", url: "mailto:email@example.com",     icon: "mail", badge: "Hot" }
      ],
      // Ikon media sosial di bawah avatar
      socials: [
        { url: "https://instagram.com/username", icon: "insta" },
        { url: "https://twitter.com/username",  icon: "x" },
        { url: "https://linkedin.com/in/username", icon: "linkedin" },
        { url: "https://github.com/username",    icon: "github" }
      ],
      footerUrl: "#"
    };

    // Ikon inline SVG (tambah sendiri jika perlu)
    const ICONS = {
      insta: '<svg viewBox="0 0 24 24"><path d="M12 2c2.7 0 3 0 4.1.1 2.6.1 4.3 1.7 4.4 4.4.1 1 .1 1.3.1 4.1s0 3-.1 4.1c-.1 2.6-1.7 4.3-4.4 4.4-1 .1-1.3.1-4.1.1s-3 0-4.1-.1c-2.6-.1-4.3-1.7-4.4-4.4-.1-1-.1-1.3-.1-4.1s0-3 .1-4.1C3.6 3.8 5.3 2.1 8 2c1-.1 1.3-.1 4-.1zm0 3.6a6.4 6.4 0 100 12.8 6.4 6.4 0 000-12.8zm0 2.7a3.7 3.7 0 110 7.4 3.7 3.7 0 010-7.4zm6.6-2.9a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/></svg>',
      yt: '<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 00-2.1-2.2C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 00.5 6.2 31.3 31.3 0 000 12a31.3 31.3 0 00.5 5.8 3 3 0 002.1 2.2c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.2A31.3 31.3 0 0024 12a31.3 31.3 0 00-.5-5.8zM9.5 15.6V8.4l6.3 3.6z"/></svg>',
      tt: '<svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.7 4.7 0 01-3.4-1.5 4.7 4.7 0 01-1.3-3.3h-3.1v12.7a2.8 2.8 0 11-1.9-2.7V8.7a6 6 0 105.3 5.9V9a7.8 7.8 0 004.4 1.4V7.4c0-.3 0-.5-.1-.7z"/></svg>',
      globe: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 1.5-.36 2.91-1 4.17z"/></svg>',
      github: '<svg viewBox="0 0 24 24"><path d="M12 .5A11.5 11.5 0 00.5 12a11.5 11.5 0 007.9 10.9c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0023.5 12 11.5 11.5 0 0012 .5z"/></svg>',
      x: '<svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8.1 9.3L24 23h-7.5l-5.9-7.7L4 23H.3l8.7-10L0 1.2h7.7l5.3 7 6.9-7zm-1.3 19.7h2L6.6 3.3h-2.2l13.2 17.6z"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24"><path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5V9h3v10zM6.5 7.7A1.7 1.7 0 116.5 4.3a1.7 1.7 0 010 3.4zM19 19h-3v-5.3c0-1.3-.5-2.2-1.6-2.2-.9 0-1.4.6-1.6 1.2-.1.2-.1.5-.1.8V19H10V9h3v1.3c.4-.6 1.1-1.6 2.7-1.6 2 0 3.3 1.3 3.3 4v6.3z"/></svg>'
    };

    document.addEventListener("DOMContentLoaded", () => {

      document.getElementById("year").textContent = new Date().getFullYear();

      const avatarEl = document.getElementById("avatar");
      if (PROFILE.avatar) avatarEl.src = PROFILE.avatar;
      document.getElementById("name").textContent = PROFILE.name;
      document.getElementById("bio").textContent = PROFILE.bio;
      document.getElementById("footerLink").href = PROFILE.footerUrl;

      const linksEl = document.getElementById("links");
      linksEl.innerHTML = PROFILE.links
        .map(l => `
          <a href="${l.url}" target="_blank" rel="noopener">
            ${ICONS[l.icon] || ""}
            <span>${l.label}</span>
            ${l.badge ? `<span class="badge">${l.badge}</span>` : ""}
          </a>`)
        .join("");

      const socialsEl = document.getElementById("socials");
      socialsEl.innerHTML = PROFILE.socials
        .map(s => `
          <a href="${s.url}" target="_blank" rel="noopener" aria-label="Media sosial">
            ${ICONS[s.icon]}
          </a>`)
        .join("");
    });
  </script>
</body>
</html>
